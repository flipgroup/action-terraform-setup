name: Terraform setup
description: Setups up terraform for later plan and apply

inputs:
  version:
    description: Terraform version.
    required: true
  workspace:
    description: Terraform workspace name.
    required: true
  github-token:
    description: GitHub token used to authenticate HTTPS access to the Terraform module repository.
    default:
  github-module-repository:
    description: Optional GitHub Terraform module repository as owner/name, added as an authenticated HTTPS clone target.
    default:
  cache-plugin-dir:
    description: Cache the terraform plugin directory
    type: boolean
    default: true

runs:
  using: composite
  steps:
    - name: Create Terraform plugin cache dir
      if: inputs.cache-plugin-dir
      shell: bash
      run: |
        mkdir -p "$HOME/.terraform.d/plugin-cache"
        echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"
    - name: Cache Terraform providers
      if: inputs.cache-plugin-dir
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # 6.0.1
      with:
        path: ${{ env.TF_PLUGIN_CACHE_DIR }}
        key: ${{ runner.os }}-terraform-${{ inputs.version }}-${{ hashFiles('**/.terraform.lock.hcl') }}
        restore-keys: |
          ${{ runner.os }}-terraform-${{ inputs.version }}-

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # @v4.0.1
      with:
        terraform_version: ${{ inputs.version }}
        terraform_wrapper: false
    - name: Configure environment variables
      run: |
        echo "TF_CLI_ARGS_apply=-auto-approve" >>"$GITHUB_ENV"
        echo "TF_IN_AUTOMATION=true" >>"$GITHUB_ENV"
        echo "TF_INPUT=false" >>"$GITHUB_ENV"
        echo "TF_WORKSPACE=${{ inputs.workspace }}" >>"$GITHUB_ENV"
      shell: bash
    - name: Set GitHub Terraform module repository
      if: inputs.github-module-repository != '' && inputs.github-token != ''
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        git config --global \
          url."https://x-access-token:${GH_TOKEN}@github.com/${{ inputs.github-module-repository }}".insteadOf \
          "https://github.com/${{ inputs.github-module-repository }}"
      shell: bash
