name: Terraform setup
description: Setups up terraform for later plan and apply

inputs:
  version:
    description: Terraform version. If omitted, falls back to a .terraform-version file in the version-file-directory.
    default:
  version-file-directory:
    description: Location to look for the .terraform-version file, defaults to the ops subdirectory.
    default: ops
  workspace:
    description: Terraform workspace name.
    required: true
  ssh-private-key:
    description: Optional SSH private key, added to ssh-agent.
    default:
  github-module-repository:
    description: Optional GitHub Terraform module repository as owner/name, added as HTTPS -> SSH clone target.
    default:
  cache-plugin-dir:
    description: Cache the terraform plugin directory
    type: boolean
    default: true

runs:
  using: composite
  steps:
    - name: Resolve Terraform version
      id: resolve-version
      working-directory: ${{ inputs.version-file-directory }}
      shell: bash
      run: |
        if [[ -n "${{ inputs.version }}" ]]; then
          VERSION="${{ inputs.version }}"
          echo "Using version from input: $VERSION"
        elif [[ -f ".terraform-version" ]]; then
          VERSION=$(cat .terraform-version | tr -d '[:space:]')
          echo "Using version from .terraform-version file: $VERSION"
        else
          echo "::error::No Terraform version specified — provide the 'version' input or add a .terraform-version file."
          exit 1
        fi

        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Create Terraform plugin cache dir
      if: inputs.cache-plugin-dir
      shell: bash
      run: |
        mkdir -p "$HOME/.terraform.d/plugin-cache"
        echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"
    - name: Cache Terraform providers
      if: inputs.cache-plugin-dir
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # 6.0.1
      with:
        path: ${{ env.TF_PLUGIN_CACHE_DIR }}
        key: ${{ runner.os }}-terraform-${{ steps.resolve-version.outputs.version }}-${{ hashFiles('**/.terraform.lock.hcl') }}
        restore-keys: |
          ${{ runner.os }}-terraform-${{ steps.resolve-version.outputs.version }}-

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # @v4.0.1
      with:
        terraform_version: ${{ steps.resolve-version.outputs.version }}
        terraform_wrapper: false
    - name: Configure environment variables
      run: |
        echo "TF_CLI_ARGS_apply=-auto-approve" >>"$GITHUB_ENV"
        echo "TF_IN_AUTOMATION=true" >>"$GITHUB_ENV"
        echo "TF_INPUT=false" >>"$GITHUB_ENV"
        echo "TF_WORKSPACE=${{ inputs.workspace }}" >>"$GITHUB_ENV"
      shell: bash
    - name: Add SSH private key to ssh-agent
      if: inputs.ssh-private-key != ''
      env:
        # note: using env var to avoid masked key output into workflow run log
        # also explicitly tell github to mask it using the ::add-mask:: directive.
        # This should already be done for secrets but this action has no guarantees it was a secret input.
        SSH_PRIVATE_KEY: ${{ inputs.ssh-private-key }}
      run: |
        echo "::add-mask::$SSH_PRIVATE_KEY"
        eval $(ssh-agent -s)
        echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >>"$GITHUB_ENV"
        echo "$SSH_PRIVATE_KEY" | ssh-add -
      shell: bash
    - name: Set GitHub Terraform module repository
      if: inputs.github-module-repository != ''
      run: |
        git config --global \
          url."ssh://git@github.com/${{ inputs.github-module-repository }}".insteadOf \
          "https://github.com/${{ inputs.github-module-repository }}"
      shell: bash
